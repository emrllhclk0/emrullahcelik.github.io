<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0W514VBFEN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0W514VBFEN');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolyo Admin Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-10 font-sans">

    <div id="loginPanel" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-20">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Yönetici Girişi</h1>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block font-semibold">E-Posta</label>
                <input type="email" id="email" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>
            <div>
                <label class="block font-semibold">Şifre</label>
                <input type="password" id="password" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-200">
                Giriş Yap
            </button>
        </form>
    </div>

    <div id="adminPanel" class="max-w-5xl mx-auto hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Portfolyo Yönetimi</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 font-bold transition duration-200">Çıkış Yap</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-lg shadow-md h-fit">
                <h2 id="formTitle" class="text-2xl font-bold mb-6 text-center text-blue-600">Yeni Proje Ekle</h2>
                
                <form id="projectForm" class="space-y-4">
                    <input type="hidden" id="project_id">
                    <input type="hidden" id="existing_image_url">

                    <div>
                        <label class="block font-semibold">Proje Başlığı</label>
                        <input type="text" id="title" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                    </div>

                    <div>
                        <label class="block font-semibold">Açıklama</label>
                        <textarea id="description" rows="4" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400" required></textarea>
                    </div>

                    <div>
                        <label class="block font-semibold">Kullanılan Teknolojiler (Virgülle ayırın)</label>
                        <input type="text" id="tech_stack" placeholder="Örn: Flutter, Supabase, JavaScript" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label class="block font-semibold">Kapak Fotoğrafı Seç</label>
                        <input type="file" id="image_file" accept="image/*" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <p id="image_help" class="text-sm text-gray-500 mt-1">Yeni resim seçmezseniz eski resim kalır.</p>
                    </div>

                    <div>
                        <label class="block font-semibold">GitHub Linki</label>
                        <input type="text" id="github_url" placeholder="https://github.com/..." class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div>
                        <label class="block font-semibold">Canlı Site Linki (Opsiyonel)</label>
                        <input type="text" id="live_url" placeholder="https://..." class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-200">Kaydet</button>
                        <button type="button" id="cancelBtn" class="hidden w-1/3 bg-gray-500 text-white font-bold py-2 px-4 rounded hover:bg-gray-600 transition duration-200" onclick="resetForm()">İptal</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-8 rounded-lg shadow-md">
                <h2 class="text-xl font-bold mb-6 text-gray-700 border-b pb-2">Mevcut Projeler</h2>
                <div id="projectsList" class="space-y-4 h-[600px] overflow-y-auto pr-2">
                    <p class="text-gray-500 italic">Yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
