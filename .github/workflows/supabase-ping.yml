name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */5 * *' # Her 5 günde bir gece yarısı (UTC) çalışır
  workflow_dispatch: # Actions sekmesinden manuel tetiklemeye olanak tanır

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase API İstegi
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=*&limit=1"
