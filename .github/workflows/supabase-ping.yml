name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */5 * *' # Her 5 günde bir gece yarısı (UTC) çalışır
  workflow_dispatch: # Actions sekmesinden manuel tetiklemeye olanak tanır

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase API İstegi
        run: |
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=*&limit=1")
          
          echo "HTTP Status: $HTTP_STATUS"
          cat response.txt
          echo ""
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Hata: API istegi basarisiz oldu! (Status: $HTTP_STATUS)"
            exit 1
          fi
